<!DOCTYPE html>
<html lang="fr" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dessine et devine · Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE: on rigole des dessins ratés des collègues
   IDEA: un tableau blanc au milieu d'une salle d'arcade néon rose
   PICTURE: le dessin en cours, grand, au centre
   COLOUR and TYPE: nuit violette, néon rose, tableau blanc ; Press Start 2P pour les titres, Inter
   LAYOUT: barre du haut ; mot et chrono ; tableau + outils ; joueurs et chat à droite (dessous sur téléphone) */
:root{color-scheme:dark;--pk:#ec4899}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0716;color:#f5f3ff;font-family:Inter,system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) 12px 8px;flex:none}
.navbtn,.pillbtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:10px;border:2px solid #4c1d95;background:#120c24;text-decoration:none;font-weight:600;color:#f5f3ff}
.pillbtn{background:#facc15;color:#111;border-color:#facc15}.pillbtn.me{background:#f5f3ff;color:#111;border-color:#f5f3ff;font-weight:500}
.wrap{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:0 14px 14px;min-height:0;max-width:1280px;width:100%;margin:0 auto}
main{display:flex;flex-direction:column;gap:10px;min-height:0}
#word{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#120c24;border:2px solid var(--pk);border-radius:12px;padding:8px 14px;box-shadow:0 0 18px #ec489933}
#mask{font:400 clamp(14px,2.2vw,22px) "Press Start 2P",monospace;letter-spacing:.25em;color:#fff;text-shadow:0 0 8px #f9a8d4}
#who{font-size:14px;color:#f9a8d4;font-weight:600}
#clock{font:400 18px "Press Start 2P",monospace;color:#facc15;min-width:3ch;text-align:right}
#bar{height:6px;background:#2a1f4f;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;background:var(--pk);width:100%}
.board{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#cv{background:#fff;border-radius:12px;box-shadow:0 0 0 4px #120c24,0 0 0 6px var(--pk);touch-action:none;max-width:100%;max-height:100%;aspect-ratio:4/3;width:100%;height:auto;cursor:crosshair}
#over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;pointer-events:none}
#over>div{background:#120c24ee;border:2px solid var(--pk);border-radius:14px;padding:18px 22px;pointer-events:auto;max-width:92%}
#over h2{font:400 16px "Press Start 2P",monospace;margin:0 0 10px;line-height:1.5;color:#fff}
#over p{margin:6px 0;color:#f9a8d4}
.choice{min-height:52px;padding:10px 18px;margin:6px;border-radius:12px;border:2px solid var(--pk);background:#1a1235;color:#fff;font:800 18px Inter;cursor:pointer}
.choice:hover{background:var(--pk);color:#0a0716}
#tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #120c24;box-shadow:0 0 0 2px #4c1d95;cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px #fff}
.tool{min-height:40px;padding:6px 12px;border-radius:10px;border:2px solid #4c1d95;background:#120c24;color:#fff;font:700 14px Inter;cursor:pointer}
.tool[aria-pressed=true]{background:#fff;color:#120c24;border-color:#fff}
aside{display:flex;flex-direction:column;gap:10px;min-height:0}
.box{background:#120c24;border:2px solid #2e2260;border-radius:14px;padding:12px}
.box h3{margin:0 0 8px;font:400 11px "Press Start 2P",monospace;color:#f9a8d4}
#plist{display:flex;flex-direction:column;gap:4px}
.pl{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#1a1235;font-size:14px}
.pl b{flex:1}.pl .pts{font-variant-numeric:tabular-nums;color:#facc15;font-weight:700}
.pl.found{background:#14532d}.pl.draw{outline:2px solid var(--pk)}
.chatbox{flex:1;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:1.4;min-height:80px}
#log .ok{color:#4ade80;font-weight:700}#log .sys{color:#a78bfa;font-style:italic}
#gf{display:flex;gap:6px;margin-top:8px}
#gi{flex:1;min-height:46px;border-radius:10px;border:2px solid #4c1d95;background:#0a0716;color:#fff;padding:0 12px;font:16px Inter}
#gf button{min-height:46px;padding:0 14px;border:0;border-radius:10px;background:var(--pk);color:#0a0716;font:800 15px Inter;cursor:pointer}
.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:#120c24f2;padding:24px 26px;border-radius:16px;z-index:5;width:min(470px,92%);border:2px solid var(--pk);box-shadow:0 0 0 4px #0a0716,0 0 40px #ec489944}
.panel h1{font:400 20px "Press Start 2P",monospace;margin:0 0 12px;line-height:1.5;color:#fff;text-shadow:0 0 8px #f9a8d4,0 0 20px #db2777}
.panel p{margin:8px 0;color:#c4b5fd;line-height:1.5}
.btn{min-height:52px;padding:10px 24px;border:0;border-radius:12px;background:var(--pk);color:#0a0716;font:800 17px Inter;cursor:pointer;margin:6px 4px}
.ghost{min-height:44px;padding:8px 16px;border:2px solid #4c1d95;border-radius:10px;background:transparent;color:#f5f3ff;font:600 15px Inter;cursor:pointer;margin:6px 4px;text-decoration:none;display:inline-flex;align-items:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:0 8px 8px;gap:8px}
  main{gap:6px}.board{flex:none}
  #cv{width:100%;max-height:46dvh;width:auto}
  aside{min-height:0}
  #plist{flex-direction:row;flex-wrap:wrap}.pl{padding:4px 8px;font-size:12px}
  .box{padding:8px}.box h3{display:none}
  .sw{width:30px;height:30px}.tool{min-height:36px;padding:4px 10px}
}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:12px 18px;border-radius:10px;z-index:80;max-width:90vw}
</style>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0a0716">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcade">
<link rel="apple-touch-icon" href="../icons/apple-180.png">
<link rel="icon" href="../icons/icon-192.png">
<script src="../shared/app.js"></script>
</head>
<body>
<div class="top"><a class="navbtn" href="../">← Arcade</a><span id="pill"></span></div>
<div class="wrap">
  <main>
    <div id="word"><span id="who">En attente</span><span id="mask"></span><span id="clock"></span></div>
    <div id="bar"><i></i></div>
    <div class="board"><canvas id="cv" width="1000" height="750" aria-label="Tableau de dessin"></canvas><div id="over" hidden></div></div>
    <div id="tools" hidden></div>
  </main>
  <aside>
    <div class="box"><h3>JOUEURS</h3><div id="plist"></div></div>
    <div class="box chatbox"><h3>DEVINE ICI</h3><div id="log" aria-live="polite"></div>
      <form id="gf"><input id="gi" maxlength="60" autocomplete="off" placeholder="Ta proposition…" aria-label="Ta proposition"><button>Envoyer</button></form></div>
  </aside>
</div>
<div class="panel" id="panel">
  <h1>DESSINE ET DEVINE</h1>
  <p>Chacun son tour, un joueur dessine un mot et les autres le devinent dans le chat. Plus tu trouves vite, plus tu marques. Le dessinateur gagne des points pour chaque collègue qui trouve.</p>
  <p>De 2 à 10 joueurs.</p>
  <button class="btn" id="multi">Créer ou rejoindre un salon</button><br>
  <a class="ghost" href="../">← Arcade</a>
</div>
<div id="toast" role="status" hidden></div>
<script src="../firebase-config.js"></script>
<script src="../shared/games.js"></script>
<script src="../shared/lobby.js"></script>
<script src="words.js"></script>
<script src="game.js"></script>
<script type="module" src="../shared/online.js"></script>
</body>
</html>
